  <rect x="176" y="300" width="8" height="40" fill="#6B5A48"/>
  <rect x="227" y="112" width="8" height="258" fill="#FBFAF6"/>
  <rect x="112" y="237" width="238" height="8" fill="#FBFAF6"/>
  <rect x="84" y="384" width="294" height="14" rx="4" fill="#FBFAF6"/>
  <rect x="84" y="396" width="294" height="5" fill="#000" opacity="0.05"/>

  <!-- Sunlight on floor -->
