    <path d="M232 508 L274 514 L284 566 L210 556 Z" fill="#D9A441"/>
    <g stroke="#B88729" stroke-width="2"><line x1="226" y1="530" x2="220" y2="556"/><line x1="240" y1="532" x2="236" y2="558"/><line x1="254" y1="534" x2="252" y2="561"/><line x1="268" y1="536" x2="268" y2="563"/></g>
    <rect x="228" y="505" width="48" height="10" rx="3" fill="#243B32" transform="rotate(8 252 510)"/>
