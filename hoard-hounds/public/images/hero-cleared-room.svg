  <!-- Boxes -->
  <g>
    <ellipse cx="470" cy="560" rx="150" ry="14" fill="#000" opacity="0.08"/>
    <rect x="360" y="470" width="130" height="90" rx="4" fill="#C99A62"/>
    <rect x="360" y="470" width="130" height="16" fill="#B5864F"/>
