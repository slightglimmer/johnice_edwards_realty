  <!-- Plant -->
  <g>
    <ellipse cx="690" cy="560" rx="44" ry="8" fill="#000" opacity="0.08"/>
    <path d="M664 500 H716 L708 560 H672 Z" fill="#243B32"/>
    <path d="M690 500 C 670 470, 640 460, 630 430 C 660 440, 680 455, 690 495" fill="#7E9A7A"/>
