    <rect x="380" y="410" width="100" height="12" fill="#C2955D"/>
    <rect x="422" y="410" width="16" height="62" fill="#EFDFBC" opacity="0.8"/>
    <rect x="512" y="520" width="44" height="22" rx="3" fill="#F7F3EB"/>
    <rect x="519" y="527" width="30" height="3" fill="#A7B8A2"/>
    <rect x="519" y="533" width="20" height="3" fill="#A7B8A2"/>
