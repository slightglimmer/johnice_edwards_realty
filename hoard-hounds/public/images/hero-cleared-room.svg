  <rect x="112" y="112" width="238" height="258" fill="url(#sky)"/>
  <circle cx="300" cy="160" r="26" fill="#FFF3CF"/>
  <path d="M112 330 C 160 300, 210 318, 250 300 S 320 290, 350 305 V370 H112 Z" fill="#A7B8A2"/>
  <circle cx="160" cy="290" r="42" fill="#7E9A7A"/>
