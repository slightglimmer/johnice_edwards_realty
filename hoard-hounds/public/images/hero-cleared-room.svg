<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640">
  <!-- PLACEHOLDER illustration. Replace with a real photo of a cleared, empty room (see README). -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF1EA"/>
      <stop offset="1" stop-color="#DCE4D7"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D2AE84"/>
      <stop offset="1" stop-color="#B98F63"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFD8E6"/>
      <stop offset="1" stop-color="#EAF3F4"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6DD" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFF6DD" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B9C6B4"/>
      <stop offset="1" stop-color="#CFD9CB"/>
    </linearGradient>
  </defs>

  <!-- Wall and floor -->
  <rect width="800" height="640" fill="url(#wall)"/>
  <rect y="455" width="800" height="185" fill="url(#floor)"/>
  <g stroke="#A97F55" stroke-opacity="0.45" stroke-width="2">
    <line x1="0" y1="490" x2="800" y2="490"/>
    <line x1="0" y1="530" x2="800" y2="530"/>
    <line x1="0" y1="578" x2="800" y2="578"/>
    <line x1="120" y1="455" x2="120" y2="490"/><line x1="390" y1="455" x2="390" y2="490"/><line x1="640" y1="455" x2="640" y2="490"/>
    <line x1="250" y1="490" x2="250" y2="530"/><line x1="530" y1="490" x2="530" y2="530"/>
    <line x1="80" y1="530" x2="80" y2="578"/><line x1="420" y1="530" x2="420" y2="578"/><line x1="720" y1="530" x2="720" y2="578"/>
    <line x1="200" y1="578" x2="200" y2="640"/><line x1="560" y1="578" x2="560" y2="640"/>
  </g>
  <rect y="440" width="800" height="18" fill="#FBFAF6"/>
  <rect y="456" width="800" height="3" fill="#000" opacity="0.06"/>

  <!-- Crown molding -->
  <rect width="800" height="16" fill="#FBFAF6"/>

  <!-- Window -->
