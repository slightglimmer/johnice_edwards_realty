  <rect x="618" y="164" width="122" height="281" fill="url(#door)"/>
  <polygon points="618,164 670,184 670,445 618,445" fill="#FBFAF6" opacity="0.6"/>
  <circle cx="658" cy="315" r="5" fill="#D9A441"/>

