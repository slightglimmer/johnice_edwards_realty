<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Property Cleanouts &amp; Junk Removal in Redford &amp; Metro Detroit | Hoard Hounds</title>
    <meta
      name="description"
      content="Hoard Hounds LLC provides vacant property, estate, rental and investor cleanouts plus junk removal in Redford, Detroit and across Metro Detroit. Request a free quote with photos."
    />
    <!-- PLACEHOLDER domain: replace https://www.hoardhounds.com everywhere once you own a domain. -->
    <link rel="canonical" href="https://www.hoardhounds.com/" />
    <meta name="theme-color" content="#243B32" />
    <meta name="geo.region" content="US-MI" />
    <meta name="geo.placename" content="Redford, Michigan" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hoard Hounds" />
    <meta property="og:title" content="Hoard Hounds | Property Cleanouts &amp; Junk Removal in Metro Detroit" />
    <meta property="og:description" content="We Clear the Clutter. You Reclaim the Property. Locally owned property cleanouts and junk removal based in Redford, Michigan." />
    <meta property="og:url" content="https://www.hoardhounds.com/" />
    <meta property="og:image" content="https://www.hoardhounds.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600..800;1,9..144,500&family=Plus+Jakarta+Sans:wght@400..800&display=swap"
    />
    <link rel="preload" as="image" href="/images/hero-cleared-room.svg" />

    <!-- Lets CSS hide scroll-reveal content only when JavaScript is running. -->
    <script>document.documentElement.classList.add('js')</script>
    <!--structured-data-->
  </head>
  <body>
    <div id="root"></div>

    <!--
      Netlify Forms reads this hidden copy of the quote form at deploy time so it knows
      which fields (and file uploads) to accept. Keep the field names in sync with
      src/sections/QuoteForm.jsx and src/lib/submitQuote.js. Other providers ignore it.
    -->
    <form name="quote" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="_subject" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="address" />
      <input type="text" name="cleanoutType" />
      <textarea name="description"></textarea>
      <input type="text" name="preferredDate" />
      <input type="text" name="consent" />
      <input type="file" name="photo1" />
      <input type="file" name="photo2" />
      <input type="file" name="photo3" />
      <input type="file" name="photo4" />
      <input type="file" name="photo5" />
      <input type="file" name="photo6" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
